<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Filtros, parametros e acoes</title>
<style>
body{margin:0;font-family:Arial, sans-serif;background:#f8fafc;color:#1e293b}
main{max-width:1120px;margin:28px auto;padding:0 20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.panel{background:white;border:1px solid #cbd5e1;border-radius:8px;padding:18px;min-height:360px}
.bad{border-top:6px solid #dc2626} .good{border-top:6px solid #16a34a}
.kpi{font-size:34px;font-weight:800;margin:8px 0} .muted{color:#64748b}
.bar{height:20px;background:#e2e8f0;margin:10px 0;border-radius:3px;overflow:hidden}
.fill{height:100%;background:#2563eb} .hot{background:#e35d22}
table{width:100%;border-collapse:collapse;margin-top:12px}td,th{border-bottom:1px solid #e2e8f0;padding:8px;text-align:left}
</style>
</head>
<body><main><h1>Filtros, parametros e acoes</h1><div class="grid"><section class="panel bad"><h2>Antes</h2><p>Exemplo com problema de estrutura, excesso ou falta de mensagem.</p><div class="bar"><div class="fill" style="width:80%"></div></div><div class="bar"><div class="fill hot" style="width:55%"></div></div></section><section class="panel good"><h2>Depois</h2><p>Exemplo com hierarquia, evidencia e decisao clara.</p><div class="kpi">Acao prioritaria</div><table><tr><th>Evidencia</th><th>Impacto</th></tr><tr><td>Causa principal</td><td>+R$85k</td></tr></table></section></div></main></body></html>
